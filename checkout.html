<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>结算 · NOVA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="checkout">
  <header class="topbar">
    <div class="left">
      <a href="index.html" class="link">← 返回</a>
      <div class="brand">NOVA</div>
    </div>
    <div class="right">
      <a href="user.html" class="link">个人中心</a>
    </div>
  </header>

  <main class="container narrow">
    <h2>结算（模拟）</h2>

    <section id="checkoutList" class="checkout-list"></section>

    <section class="checkout-form card">
      <h3>收件人信息</h3>
      <label>姓名 <input id="inputName" type="text" placeholder="收货人姓名"></label>
      <label>手机号 <input id="inputPhone" type="tel" placeholder="手机号"></label>
      <label>地址 <input id="inputAddress" type="text" placeholder="详细地址"></label>
      <div class="checkout-summary">
        <div>商品总计：¥ <span id="checkoutTotal">0.00</span></div>
        <div>预计佣金（平台抽成示例 5%）：¥ <span id="checkoutCommission">0.00</span></div>
      </div>
      <button id="placeOrderBtn" class="btn primary">确认下单（模拟）</button>
    </section>

    <div id="orderResult" class="order-result hidden"></div>
  </main>

  <script src="db.js"></script>
  <script src="data/products.js"></script>
  <script src="app.js"></script>
</body>
</html>
