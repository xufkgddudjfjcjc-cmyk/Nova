<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>创作者 / 商家入驻 · NOVA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="merchant">
  <header class="topbar">
    <div class="left"><a href="index.html" class="link">← 返回</a><div class="brand">NOVA</div></div>
    <div class="right"><a href="user.html" class="link">个人中心</a></div>
  </header>

  <main class="container narrow">
    <h2>创作者 / 商家入驻（模拟）</h2>
    <p class="muted">提交入驻后你可以登录并使用商家后台管理商品与查看订单（均为本地模拟）</p>

    <form id="merchantApply" class="card form">
      <label>店铺 / 创作者 名称 <input id="mName" required></label>
      <label>联系人 <input id="mContact" required></label>
      <label>联系方式 <input id="mContactInfo"></label>
      <label>简介 <textarea id="mDesc" rows="3"></textarea></label>
      <div class="row">
        <button type="submit" class="btn primary">提交入驻申请</button>
        <a id="goAdmin" href="admin.html" class="btn">商家后台</a>
      </div>
    </form>

    <div id="applyResult" class="order-result hidden"></div>
  </main>

  <script src="db.js"></script>
  <script src="data/products.js"></script>
  <script src="app.js"></script>
</body>
</html>
